name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Clean untracked files
      run: git clean -fd

    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        ./gradlew assembleFullRelease \
          -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
          -Dkotlin.daemon.jvm.options="-Xmx2g" \
          -Dkotlin.compiler.execution.strategy="in-process" \
          -Dorg.gradle.daemon=true \
          -Dorg.gradle.workers.max=8 \
          -Dorg.gradle.caching=true \
          -Pandroid.injected.signing.store.file="${{ github.workspace }}/keystore/demokeystore.jks" \
          -Pandroid.injected.signing.store.password="diyapsdemo" \
          -Pandroid.injected.signing.key.alias="DIYAPS" \
          -Pandroid.injected.signing.key.password="diyapsdemo"

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aaps-${{ github.run_number }}
        path: app/build/outputs/apk/full/release/*.apk
